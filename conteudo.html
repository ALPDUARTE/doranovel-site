<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('fundo2.png');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            padding: 15px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000; gap: 10px;
        }
        .nav-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .brand-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 45px; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.3rem; text-transform: uppercase; }

        .nav-user-row { 
            width: 100%; display: flex; justify-content: space-between; align-items: center; 
            padding-top: 5px; border-top: 1px solid rgba(225, 173, 1, 0.2);
        }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; }
        .user-avatar-container {
            width: 35px; height: 35px; border-radius: 50%; 
            background: #1a1a1a; display: flex; align-items: center; 
            justify-content: center; border: 1px solid #E1AD01; overflow: hidden;
        }
        .user-photo { width: 100%; height: 100%; object-fit: cover; }
        .default-avatar-icon { font-size: 18px; color: #E1AD01; }
        .btn-sair { 
            color: #E1AD01; text-decoration: none; font-weight: 700; border: 1px solid #E1AD01; 
            padding: 6px 15px; border-radius: 20px; font-size: 0.7rem; transition: 0.3s;
        }
        .btn-sair:hover { background: #E1AD01; color: #000; }

        /* --- FILTROS --- */
        .search-container { 
            padding: 25px 5% 10px; 
            display: flex; flex-direction: column; gap: 15px; width: 100%;
            max-width: 1200px; margin: 0 auto;
        }

        .filters-wrapper { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .search-row { display: flex; align-items: center; gap: 10px; width: 100%; }
        .search-box { flex-grow: 1; }
        .search-box input, .category-filter {
            width: 100%; padding: 12px 20px; border-radius: 25px; 
            border: 1px solid rgba(225, 173, 1, 0.5); background: rgba(0,0,0,0.6); color: #fff; 
            outline: none; font-family: 'Montserrat'; font-size: 0.85rem; transition: 0.3s;
        }
        .search-box input:focus, .category-filter:focus { border-color: #E1AD01; background: rgba(0,0,0,0.9); }

        .btn-filter-fav {
            background: rgba(0,0,0,0.6); border: 1px solid #E1AD01; color: #E1AD01;
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-filter-fav.active { background: #E1AD01; color: #000; }

        /* --- GRID E CARDS --- */
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 15px; padding: 20px 5%;
        }
        .card {
            border-radius: 18px; overflow: hidden; transition: 0.3s;
            cursor: pointer; display: flex; flex-direction: column; padding: 8px;
            height: 320px; position: relative; border: 1px solid rgba(255,255,255,0.05);
        }
        .card:hover { transform: translateY(-5px); border-color: #E1AD01; }
        .card-img-container { width: 100%; flex-grow: 1; border-radius: 12px; overflow: hidden; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* BADGE DE NOTA (ESTRELAS) */
        .card-rating-badge {
            position: absolute; top: 8px; left: 8px;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            padding: 4px 8px; border-radius: 6px; font-size: 0.7rem;
            font-weight: 700; display: flex; align-items: center; gap: 4px;
            border: 1px solid rgba(225, 173, 1, 0.4); z-index: 5;
        }
        .card-rating-badge i { color: #E1AD01; font-size: 0.65rem; }

        .card-fav-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
            border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; z-index: 5;
        }
        .card-fav-btn.is-fav { color: #ff4757; background: #fff; }

        .card-info { padding: 10px 5px; text-align: center; color: #000; }
        .card-category { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
        .card-title { font-weight: 700; font-size: 0.75rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* MODAL DE VÍDEO */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; z-index: 3000;
        }
        .video-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #videoIframe { width: 100%; height: 100%; transform: scale(1.05); }

        .close-modal {
            position: absolute; top: 20px; right: 20px; color: rgba(255,255,255,0.5); 
            font-size: 1.5rem; cursor: pointer; z-index: 3100;
            background: rgba(0,0,0,0.3); width: 45px; height: 45px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .close-modal:hover { color: #fff; background: rgba(255,255,255,0.2); border-color: #E1AD01; }

        @media (min-width: 768px) {
            .navbar { flex-direction: row; justify-content: space-between; }
            .nav-user-row { width: auto; border-top: none; padding-top: 0; gap: 20px; }
            .filters-wrapper { flex-direction: row; justify-content: space-between; align-items: center; }
            .search-row { width: 60%; }
            .category-filter { width: 35%; max-width: 300px; }
        }

        @media (max-width: 600px) {
            .content-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .card { height: 280px; }
        }

        /* CORES CATEGORIAS */
        .cat-encontros { background-color: #D48498; }
        .cat-suspense { background-color: #F0F0F0; }
        .cat-melodramas { background-color: #A52A2A; color: #fff !important; }
        .cat-melodramas .card-info { color: #fff; }
        .cat-epicos { background-color: #CD7F32; }
        .cat-cotidiano { background-color: #D2B48C; }
        .cat-direito { background-color: #000080; color: #fff !important; }
        .cat-direito .card-info { color: #fff; }
        .cat-medicina { background-color: #50C878; }
        .cat-juventude { background-color: #E1AD01; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-top">
            <a href="#" class="brand-container">
                <img src="logo.png" alt="Logo" class="logo-img">
                <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
            </a>
        </div>
        <div class="nav-user-row" id="authSection"></div>
    </nav>

    <div class="search-container">
        <div class="filters-wrapper">
            <div class="search-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Pesquisar título...">
                </div>
                <button class="btn-filter-fav" id="filterFavBtn" title="Ver Favoritos">
                    <i class="fas fa-heart"></i>
                </button>
            </div>
            
            <select class="category-filter" id="categorySelect">
                <option value="all">Todas Categorias</option>
                <option value="Encontros e Destinos">Encontros e Destinos</option>
                <option value="Suspense & Mistério">Suspense & Mistério</option>
                <option value="Melodramas Intensos">Melodramas Intensos</option>
                <option value="Épicos Históricos">Épicos Históricos</option>
                <option value="Cotidiano">Cotidiano</option>
                <option value="Direito & Justiça">Direito & Justiça</option>
                <option value="Medicina & Vida">Medicina & Vida</option>
                <option value="Juventude & Sonhos">Juventude & Sonhos</option>
            </select>
        </div>
    </div>

    <main class="content-grid" id="contentGrid"></main>

    <div class="video-modal" id="videoModal">
        <div class="close-modal" id="closeModal" title="Fechar Vídeo">
            <i class="fas fa-times"></i>
        </div>
        <div class="video-container">
            <iframe id="videoIframe" src="" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let allData = [];
        let favorites = JSON.parse(localStorage.getItem('doranovel_favs')) || [];
        let filterOnlyFavs = false;

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Suspense & Mistério": "cat-suspense",
            "Melodramas Intensos": "cat-melodramas",
            "Épicos Históricos": "cat-epicos",
            "Cotidiano": "cat-cotidiano",
            "Direito & Justiça": "cat-direito",
            "Medicina & Vida": "cat-medicina",
            "Juventude & Sonhos": "cat-juventude"
        };

        function render(list) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";
            list.forEach(item => {
                const isFav = favorites.includes(item.id);
                const mainCat = Array.isArray(item.categorias) ? item.categorias[0] : "Geral";
                
                // Cálculo da Média de Estrelas
                let media = "0,0";
                if(item.votecount && item.votecount > 0) {
                    media = (item.totalStar / item.votecount).toFixed(1).replace('.', ',');
                }

                const card = document.createElement('div');
                card.className = `card ${colorMap[mainCat] || ''}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <div class="card-rating-badge">
                            <i class="fas fa-star"></i> ${media}
                        </div>
                        <button class="card-fav-btn ${isFav ? 'is-fav' : ''}" onclick="window.toggleFav('${item.id}', event)">
                            <i class="fas fa-heart"></i>
                        </button>
                        <img src="${item.capa}" alt="${item.titulo}">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${mainCat}</div>
                        <div class="card-title">${item.titulo}</div>
                    </div>
                `;
                card.onclick = () => {
                    window.location.href = `sinopse.html?id=${item.id}`;
                };
                grid.appendChild(card);
            });
        }

        window.toggleFav = (id, e) => {
            e.stopPropagation();
            favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
            localStorage.setItem('doranovel_favs', JSON.stringify(favorites));
            filterData();
        };

        function openVideo(url) {
            if(!url) return;
            const iframe = document.getElementById('videoIframe');
            let videoId = url.includes("v=") ? url.split("v=")[1].split("&")[0] : url.split("/").pop();
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&controls=1`;
            document.getElementById('videoModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
            document.body.style.overflow = 'auto';
            const url = new URL(window.location);
            url.searchParams.delete('play');
            window.history.replaceState({}, '', url);
        };

        const filterData = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const selectedCat = document.getElementById('categorySelect').value;
            const filtered = allData.filter(i => {
                const mName = i.titulo.toLowerCase().includes(search);
                const mCat = selectedCat === 'all' || (Array.isArray(i.categorias) && i.categorias.includes(selectedCat));
                const mFav = filterOnlyFavs ? favorites.includes(i.id) : true;
                return mName && mCat && mFav;
            });
            render(filtered);
        };

        document.getElementById('searchInput').oninput = filterData;
        document.getElementById('categorySelect').onchange = filterData;
        document.getElementById('filterFavBtn').onclick = function() {
            filterOnlyFavs = !filterOnlyFavs;
            this.classList.toggle('active');
            filterData();
        };

        onAuthStateChanged(auth, user => {
            const authSection = document.getElementById('authSection');
            if(user) {
                const avatar = user.photoURL ? `<img src="${user.photoURL}" class="user-photo">` : `<i class="fas fa-user-circle default-avatar-icon"></i>`;
                authSection.innerHTML = `
                    <div class="user-info">
                        <div class="user-avatar-container">${avatar}</div>
                        <span>${user.displayName || 'Dora Fã'}</span>
                    </div>
                    <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
                `;
                document.getElementById('btnLogout').onclick = async (e) => {
                    e.preventDefault();
                    await signOut(auth);
                    window.location.href = "https://doranovel.com";
                };
            } else {
                authSection.innerHTML = `<a href="login.html" class="btn-sair">ENTRAR</a>`;
            }
        });

        async function init() {
            const snap = await getDocs(collection(db, "Produções"));
            allData = snap.docs.map(doc => ({
                id: doc.id,
                ...doc.data(),
                titulo: doc.data().Título || doc.data().titulo || "Sem Título",
                capa: doc.data().Capa || doc.data().capa || "",
                categorias: doc.data().Categoria || doc.data().categoria || [],
                video: doc.data()["Link do Episódio"] || doc.data().video || "",
                totalStar: doc.data().totalStar || 0,
                votecount: doc.data().votecount || 0
            }));
            render(allData);

            const urlParams = new URLSearchParams(window.location.search);
            const playId = urlParams.get('play');
            if(playId) {
                const docRef = doc(db, "Produções", playId);
                const docSnap = await getDoc(docRef);
                if(docSnap.exists()){
                    const vUrl = docSnap.data()["Link do Episódio"] || docSnap.data().video;
                    openVideo(vUrl);
                }
            }
        }
        init();
    </script>
</body>
</html>
