<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('fundo2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
        }

        /* --- NAVBAR (Logo e Nome Alinhados) --- */
        .navbar {
            width: 100%; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000;
        }

        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 50px; width: auto; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #E1AD01; object-fit: cover; }
        
        .btn-sair { 
            color: #E1AD01; text-decoration: none; font-weight: 700; font-size: 0.8rem; 
            border: 1px solid #E1AD01; padding: 8px 20px; border-radius: 20px; transition: 0.3s;
        }
        .btn-sair:hover { background: #E1AD01; color: #000; }

        /* --- FILTROS --- */
        .search-container {
            padding: 20px 5%; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
        }
        .search-box { flex: 2; min-width: 280px; }
        .search-box input {
            width: 100%; padding: 15px 25px; border-radius: 50px; border: 1px solid rgba(225, 173, 1, 0.5);
            background: rgba(0,0,0,0.7); color: #fff; outline: none;
        }

        .category-filter {
            flex: 1; min-width: 200px; padding: 15px; border-radius: 50px;
            border: 1px solid #E1AD01; background: #000; color: #fff; cursor: pointer;
        }

        /* --- GRID E CARDS --- */
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px; padding: 40px 5%;
        }

        .card {
            background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden;
            transition: 0.3s; position: relative; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); }

        .card-img-container { width: 100%; aspect-ratio: 2/3; overflow: hidden; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Ícone de Favorito */
        .btn-fav {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5);
            border: none; color: #fff; padding: 8px; border-radius: 50%; cursor: pointer; transition: 0.3s;
        }
        .btn-fav:hover { color: #ff4757; transform: scale(1.2); }

        .card-info { padding: 12px; text-align: center; background: #000; }
        .card-category { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .card-title { font-weight: 700; font-size: 0.9rem; line-height: 1.2; height: 2.4em; overflow: hidden; }

        /* CORES DAS BORDAS POR CATEGORIA (Conforme imagem e95c55) */
        .cat-encontros { border-bottom: 5px solid #D48498 !important; } /* Rosa */
        .cat-melodramas { border-bottom: 5px solid #A52A2A !important; } /* Vermelho/Castanho */
        .cat-suspense { border-bottom: 5px solid #F0F0F0 !important; } /* Branco */
        .cat-epicos { border-bottom: 5px solid #CD7F32 !important; } /* Bronze */
        .cat-medicina { border-bottom: 5px solid #00D1FF !important; } /* Azul */

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; }
            .brand-container { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        </a>
        <div class="nav-right" id="authSection">
            <a href="login.html" class="btn-sair">ENTRAR</a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="O que vamos assistir hoje?">
        </div>
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">🌸 Encontros e Destinos</option>
            <option value="Suspense & Mistério">🔍 Suspense & Mistério</option>
            <option value="Melodramas Intensos">❤️‍🔥 Melodramas Intensos</option>
            <option value="Épicos Históricos">📜 Épicos Históricos</option>
            <option value="Medicina & Vida">🏥 Medicina & Vida</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid">
        <p style="grid-column: 1/-1; text-align:center;">Sincronizando com o Firebase...</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const grid = document.getElementById('contentGrid');

        // Mapeamento de Cores para Categorias
        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Melodramas Intensos": "cat-melodramas",
            "Suspense & Mistério": "cat-suspense",
            "Épicos Históricos": "cat-epicos",
            "Medicina & Vida": "cat-medicina"
        };

        // Gestão de Usuário
        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                authSection.innerHTML = `
                    <div class="user-profile">
                        <span>Olá, <strong>${user.displayName || user.email.split('@')[0]}</strong></span>
                        <img src="${user.photoURL || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="user-avatar">
                    </div>
                    <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
                `;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
            }
        });

        // Carregamento de Dados (Baseado na image_e95c55.jpg)
        async function loadContent() {
            try {
                const querySnapshot = await getDocs(collection(db, "Produções"));
                const data = [];
                
                querySnapshot.forEach(doc => {
                    const d = doc.data();
                    data.push({
                        id: doc.id,
                        titulo: d.Título || d.titulo || "Sem Título",
                        capa: d.Capa || d.capa || "https://via.placeholder.com/200x300",
                        categoria: d.categoria || d.Categoria || "Geral"
                    });
                });
                
                const render = (list) => {
                    grid.innerHTML = list.length ? '' : '<p style="grid-column: 1/-1; text-align:center;">Nenhum resultado.</p>';
                    list.forEach(item => {
                        // Define a classe de cor baseada na categoria
                        const colorClass = colorMap[item.categoria] || '';
                        
                        const card = document.createElement('div');
                        card.className = `card ${colorClass}`;
                        card.innerHTML = `
                            <div class="card-img-container">
                                <button class="btn-fav"><i class="far fa-heart"></i></button>
                                <img src="${item.capa}" alt="${item.titulo}">
                            </div>
                            <div class="card-info">
                                <div class="card-category" style="color: ${colorClass ? 'inherit' : '#E1AD01'}">${item.categoria}</div>
                                <div class="card-title">${item.titulo}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                };

                render(data);

                // Filtros de busca e categoria
                document.getElementById('searchInput').oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    render(data.filter(i => i.titulo.toLowerCase().includes(term)));
                };

                document.getElementById('categorySelect').onchange = (e) => {
                    const val = e.target.value;
                    render(val === 'all' ? data : data.filter(i => i.categoria === val));
                };

            } catch (e) {
                console.error(e);
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Erro ao conectar ao banco de dados.</p>';
            }
        }

        loadContent();
    </script>
</body>
</html>
