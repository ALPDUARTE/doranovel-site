<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('fundo2.png');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000;
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 50px; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.8rem; text-transform: uppercase; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #E1AD01; }
        .btn-sair { color: #E1AD01; text-decoration: none; font-weight: 700; border: 1px solid #E1AD01; padding: 8px 20px; border-radius: 20px; }

        /* --- FILTROS --- */
        .search-container { padding: 20px 5%; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .search-box input, .category-filter {
            padding: 15px 25px; border-radius: 50px; border: 1px solid #E1AD01;
            background: rgba(0,0,0,0.7); color: #fff; outline: none;
        }
        .search-box { flex: 2; min-width: 280px; }
        .category-filter { flex: 1; min-width: 200px; }

        /* --- GRID E CARDS ESTILO 163820.jpg --- */
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px; padding: 40px 5%;
        }

        .card {
            border-radius: 25px; overflow: hidden; transition: 0.3s;
            cursor: pointer; display: flex; flex-direction: column; padding: 12px;
            height: 380px;
        }
        .card:hover { transform: scale(1.05); }

        .card-img-container { 
            width: 100%; flex-grow: 1; border-radius: 18px; 
            overflow: hidden; position: relative; background: #000;
        }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-fav {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5);
            border: none; color: #fff; padding: 8px; border-radius: 50%; z-index: 10;
        }

        .card-info { padding: 15px 5px 5px 5px; text-align: center; color: #000; }
        .card-category { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; opacity: 0.8; }
        .card-title { font-weight: 700; font-size: 0.85rem; line-height: 1.1; }

        /* CORES DE FUNDO DOS CARDS (Baseado na imagem 163820.jpg) */
        .cat-encontros { background-color: #D48498; } /* Rosa */
        .cat-melodramas { background-color: #A52A2A; } /* Vermelho */
        .cat-suspense { background-color: #F0F0F0; } /* Branco */
        .cat-epicos { background-color: #CD7F32; } /* Bronze */
        .cat-medicina { background-color: #4CAF50; } /* Verde */

        /* --- MODAL DO PLAYER --- */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content { width: 90%; max-width: 1000px; position: relative; border: 2px solid #E1AD01; border-radius: 15px; overflow: hidden; background: #000;}
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        .close-modal {
            position: absolute; top: -40px; right: 0; color: #E1AD01; font-size: 2rem; cursor: pointer;
        }

        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        </a>
        <div class="nav-right" id="authSection">
            <a href="login.html" class="btn-sair">ENTRAR</a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar dorama ou livro...">
        </div>
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">🌸 Encontros e Destinos</option>
            <option value="Suspense & Mistério">🔍 Suspense & Mistério</option>
            <option value="Melodramas Intensos">❤️‍🔥 Melodramas Intensos</option>
            <option value="Épicos Históricos">📜 Épicos Históricos</option>
            <option value="Medicina & Vida">🏥 Medicina & Vida</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid"></main>

    <!-- Modal de Vídeo -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times; fechar</span>
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let allData = []; // Variável global para manter os dados originais

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Melodramas Intensos": "cat-melodramas",
            "Suspense & Mistério": "cat-suspense",
            "Épicos Históricos": "cat-epicos",
            "Medicina & Vida": "cat-medicina"
        };

        // --- FUNÇÃO DE RENDERIZAÇÃO ---
        function render(list) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = list.length ? '' : '<p style="grid-column:1/-1; text-align:center;">Nenhum conteúdo encontrado.</p>';
            
            list.forEach(item => {
                const colorClass = colorMap[item.categoria] || '';
                const card = document.createElement('div');
                card.className = `card ${colorClass}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <button class="btn-fav"><i class="fas fa-heart"></i></button>
                        <img src="${item.capa}" alt="${item.titulo}">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.categoria}</div>
                        <div class="card-title">${item.titulo}</div>
                    </div>
                `;
                
                // Abrir Vídeo no Clique
                card.onclick = () => openVideo(item.video);
                grid.appendChild(card);
            });
        }

        // --- CONTROLE DO MODAL ---
        function openVideo(url) {
            if(!url) return alert("Vídeo não disponível.");
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoIframe');
            // Formata URL para embed e autoplay
            let embedUrl = url.replace("watch?v=", "embed/").split('&')[0];
            iframe.src = `${embedUrl}?autoplay=1&rel=0&modestbranding=1`;
            modal.style.display = 'flex';
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
        };

        // --- BUSCA E FILTRO ---
        document.getElementById('searchInput').oninput = (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allData.filter(i => i.titulo.toLowerCase().includes(term));
            render(filtered);
        };

        document.getElementById('categorySelect').onchange = (e) => {
            const val = e.target.value;
            const filtered = val === 'all' ? allData : allData.filter(i => i.categoria === val);
            render(filtered);
        };

        // --- CARREGAR FIREBASE ---
        async function init() {
            const snap = await getDocs(collection(db, "Produções"));
            snap.forEach(doc => {
                const d = doc.data();
                allData.push({
                    titulo: d.Título || d.titulo,
                    capa: d.Capa || d.capa,
                    categoria: d.categoria || d.Categoria,
                    video: d["Link do Episódio"] || d.video
                });
            });
            render(allData);
        }

        init();

        // Auth
        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('authSection').innerHTML = `
                    <img src="${user.photoURL || 'https://via.placeholder.com/35'}" class="user-avatar">
                    <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
                `;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
            }
        });
    </script>
</body>
</html>
