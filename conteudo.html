<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('fundo2.png');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000;
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 50px; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.5rem; text-transform: uppercase; }

        .btn-sair { color: #E1AD01; text-decoration: none; font-weight: 700; border: 1px solid #E1AD01; padding: 8px 15px; border-radius: 20px; font-size: 0.7rem; }

        /* --- FILTROS --- */
        .search-container { padding: 15px 5%; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .search-box input, .category-filter {
            width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 50px; border: 1px solid #E1AD01;
            background: rgba(0,0,0,0.7); color: #fff; outline: none; font-family: 'Montserrat';
        }

        /* --- GRID E CARDS --- */
        .content-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px; padding: 15px 5%;
        }

        .card {
            border-radius: 20px; overflow: hidden; transition: 0.3s;
            cursor: pointer; display: flex; flex-direction: column; padding: 8px;
            height: 320px; position: relative;
        }

        .card-img-container { 
            width: 100%; flex-grow: 1; border-radius: 15px; 
            overflow: hidden; position: relative; background: #000;
        }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-fav {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6);
            border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; 
            z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-fav.active { color: #ff4757; }

        .card-info { padding: 10px 5px; text-align: center; color: #000; }
        .card-category { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .card-title { font-weight: 700; font-size: 0.75rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* CORES DA TABELA 225103.PNG */
        .cat-encontros { background-color: #D48498; }
        .cat-suspense { background-color: #F0F0F0; }
        .cat-melodramas { background-color: #A52A2A; color: #fff !important; }
        .cat-melodramas .card-info { color: #fff; }
        .cat-epicos { background-color: #CD7F32; }
        .cat-cotidiano { background-color: #D2B48C; }
        .cat-direito { background-color: #000080; color: #fff !important; }
        .cat-direito .card-info { color: #fff; }
        .cat-medicina { background-color: #50C878; }
        .cat-juventude { background-color: #E1AD01; }

        /* --- MODAL DO PLAYER --- */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content { width: 100%; height: 100%; max-width: 500px; position: relative; }
        .video-wrapper { width: 100%; height: 100%; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .close-modal {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            font-size: 1rem; cursor: pointer; z-index: 2100;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid #E1AD01;
        }

        /* --- AJUSTE MOBILE (2 POR LINHA) --- */
        @media (max-width: 600px) {
            .content-grid {
                grid-template-columns: repeat(2, 1fr); /* Força 2 colunas */
                gap: 10px;
                padding: 10px;
            }
            .card { height: 280px; padding: 5px; }
            .brand-gold { font-size: 1.1rem; }
            .logo-img { height: 35px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        </a>
        <div id="authSection">
            <a href="login.html" class="btn-sair">ENTRAR</a>
        </div>
    </nav>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar título...">
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">🌸 Encontros e Destinos</option>
            <option value="Suspense & Mistério">🔍 Suspense & Mistério</option>
            <option value="Melodramas Intensos">❤️‍🔥 Melodramas Intensos</option>
            <option value="Épicos Históricos">📜 Épicos Históricos</option>
            <option value="Cotidiano">☕ Cotidiano</option>
            <option value="Direito & Justiça">⚖️ Direito & Justiça</option>
            <option value="Medicina & Vida">🏥 Medicina & Vida</option>
            <option value="Juventude & Sonhos">🎓 Juventude & Sonhos</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid"></main>

    <div class="video-modal" id="videoModal">
        <span class="close-modal" id="closeModal"><i class="fas fa-chevron-left"></i> Voltar</span>
        <div class="modal-content">
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let allData = [];

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Suspense & Mistério": "cat-suspense",
            "Melodramas Intensos": "cat-melodramas",
            "Épicos Históricos": "cat-epicos",
            "Cotidiano": "cat-cotidiano",
            "Direito & Justiça": "cat-direito",
            "Medicina & Vida": "cat-medicina",
            "Juventude & Sonhos": "cat-juventude"
        };

        function render(list) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";
            list.forEach(item => {
                const colorClass = colorMap[item.categoria] || '';
                const card = document.createElement('div');
                card.className = `card ${colorClass}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <button class="btn-fav" onclick="event.stopPropagation(); this.classList.toggle('active')">
                            <i class="fas fa-heart"></i>
                        </button>
                        <img src="${item.capa}" alt="${item.titulo}">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.categoria}</div>
                        <div class="card-title">${item.titulo}</div>
                    </div>
                `;
                card.onclick = () => openVideo(item.video);
                grid.appendChild(card);
            });
        }

        function openVideo(url) {
            if(!url) return;
            const iframe = document.getElementById('videoIframe');
            let videoId = url.includes("v=") ? url.split("v=")[1].split("&")[0] : url.split("/").pop();
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
            document.getElementById('videoModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
            document.body.style.overflow = 'auto';
        };

        const filterData = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categorySelect').value;
            const filtered = allData.filter(i => {
                const matchName = i.titulo.toLowerCase().includes(search);
                const matchCat = (category === 'all' || i.categoria.trim() === category.trim());
                return matchName && matchCat;
            });
            render(filtered);
        };

        document.getElementById('searchInput').oninput = filterData;
        document.getElementById('categorySelect').onchange = filterData;

        async function init() {
            const snap = await getDocs(collection(db, "Produções"));
            allData = [];
            snap.forEach(doc => {
                const d = doc.data();
                allData.push({
                    titulo: d.Título || d.titulo || "Sem título",
                    capa: d.Capa || d.capa || "https://via.placeholder.com/200",
                    categoria: d.categoria || d.Categoria || "Geral",
                    video: d["Link do Episódio"] || d.video
                });
            });
            render(allData);
        }
        init();

        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('authSection').innerHTML = `<a href="#" id="btnLogout" class="btn-sair">SAIR</a>`;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
            }
        });
    </script>
</body>
</html>
