<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('fundo2.png');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        /* --- NAVBAR CORRIGIDA --- */
        .navbar {
            width: 100%; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 10px;
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 50px; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.5rem; text-transform: uppercase; }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; font-weight: 700; }
        
        .user-avatar-container {
            width: 38px; height: 38px; border-radius: 50%; 
            background: #1a1a1a; display: flex; align-items: center; 
            justify-content: center; border: 1px solid #E1AD01; overflow: hidden; flex-shrink: 0;
        }
        .user-photo { width: 100%; height: 100%; object-fit: cover; }
        .default-avatar-icon { font-size: 20px; color: #E1AD01; }

        .btn-sair { 
            color: #E1AD01; text-decoration: none; font-weight: 700; border: 1px solid #E1AD01; 
            padding: 8px 20px; border-radius: 20px; font-size: 0.75rem; transition: 0.3s;
        }
        .btn-sair:hover { background: #E1AD01; color: #000; }

        /* --- FILTROS E FAVORITOS --- */
        .search-container { padding: 30px 5% 10px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        
        .search-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px; }
        .search-box { flex-grow: 1; }
        .search-box input, .category-filter {
            width: 100%; padding: 12px 25px; border-radius: 25px; 
            border: 2px solid #E1AD01; background: rgba(0,0,0,0.8); color: #fff; 
            outline: none; font-family: 'Montserrat'; font-size: 0.9rem; text-align: center;
        }

        .btn-filter-fav {
            background: rgba(0,0,0,0.8); border: 2px solid #E1AD01; color: #E1AD01;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-filter-fav.active { background: #E1AD01; color: #000; }

        /* --- GRID E CARDS --- */
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px; padding: 20px 5%;
        }
        .card {
            border-radius: 20px; overflow: hidden; transition: 0.3s;
            cursor: pointer; display: flex; flex-direction: column; padding: 10px;
            height: 340px; position: relative; border: 1px solid rgba(255,255,255,0.1);
        }
        .card-img-container { width: 100%; flex-grow: 1; border-radius: 15px; overflow: hidden; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Botão Coração no Card */
        .card-fav-btn {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5);
            border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; z-index: 5; transition: 0.3s;
        }
        .card-fav-btn.is-fav { color: #ff4757; background: rgba(255,255,255,0.9); }

        .card-info { padding: 12px 5px; text-align: center; color: #000; }
        .card-category { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .card-title { font-weight: 700; font-size: 0.8rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* CATEGORIAS */
        .cat-encontros { background-color: #D48498; }
        .cat-suspense { background-color: #F0F0F0; }
        .cat-melodramas { background-color: #A52A2A; color: #fff !important; }
        .cat-melodramas .card-info { color: #fff; }
        .cat-epicos { background-color: #CD7F32; }
        .cat-cotidiano { background-color: #D2B48C; }
        .cat-direito { background-color: #000080; color: #fff !important; }
        .cat-direito .card-info { color: #fff; }
        .cat-medicina { background-color: #50C878; }
        .cat-juventude { background-color: #E1AD01; }

        /* RESPONSIVIDADE CELULAR (QUEBRA DE LINHA) */
        @media (max-width: 600px) {
            .navbar { justify-content: center; flex-direction: column; padding: 15px 0; }
            .nav-right { width: 100%; justify-content: center; flex-direction: column; gap: 10px; }
            .user-info { flex-direction: column; gap: 5px; }
            .content-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .card { height: 300px; padding: 6px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        </a>
        <div class="nav-right" id="authSection">
            <a href="login.html" class="btn-sair">ENTRAR</a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-row">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pesquisar título...">
            </div>
            <button class="btn-filter-fav" id="filterFavBtn" title="Meus Favoritos">
                <i class="fas fa-heart"></i>
            </button>
        </div>
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">Encontros e Destinos</option>
            <option value="Suspense & Mistério">Suspense & Mistério</option>
            <option value="Melodramas Intensos">Melodramas Intensos</option>
            <option value="Épicos Históricos">Épicos Históricos</option>
            <option value="Cotidiano">Cotidiano</option>
            <option value="Direito & Justiça">Direito & Justiça</option>
            <option value="Medicina & Vida">Medicina & Vida</option>
            <option value="Juventude & Sonhos">Juventude & Sonhos</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid"></main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let allData = [];
        let favorites = JSON.parse(localStorage.getItem('doranovel_favs')) || [];
        let filterOnlyFavs = false;

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Suspense & Mistério": "cat-suspense",
            "Melodramas Intensos": "cat-melodramas",
            "Épicos Históricos": "cat-epicos",
            "Cotidiano": "cat-cotidiano",
            "Direito & Justiça": "cat-direito",
            "Medicina & Vida": "cat-medicina",
            "Juventude & Sonhos": "cat-juventude"
        };

        function toggleFav(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('doranovel_favs', JSON.stringify(favorites));
            filterData();
        }

        function render(list) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";
            list.forEach(item => {
                const isFav = favorites.includes(item.id);
                const mainCat = Array.isArray(item.categorias) ? item.categorias[0] : "Geral";
                const colorClass = colorMap[mainCat] || '';
                
                const card = document.createElement('div');
                card.className = `card ${colorClass}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <button class="card-fav-btn ${isFav ? 'is-fav' : ''}" onclick="window.toggleFav('${item.id}', event)">
                            <i class="fas fa-heart"></i>
                        </button>
                        <img src="${item.capa}" alt="${item.titulo}">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${mainCat}</div>
                        <div class="card-title">${item.titulo}</div>
                    </div>
                `;
                card.onclick = () => window.open(item.video, '_blank');
                grid.appendChild(card);
            });
        }

        window.toggleFav = toggleFav;

        const filterData = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const selectedCat = document.getElementById('categorySelect').value;

            const filtered = allData.filter(item => {
                const matchName = item.titulo.toLowerCase().includes(search);
                const matchCat = selectedCat === 'all' || (Array.isArray(item.categorias) && item.categorias.includes(selectedCat));
                const matchFav = filterOnlyFavs ? favorites.includes(item.id) : true;
                
                return matchName && matchCat && matchFav;
            });
            render(filtered);
        };

        document.getElementById('searchInput').oninput = filterData;
        document.getElementById('categorySelect').onchange = filterData;
        
        document.getElementById('filterFavBtn').onclick = function() {
            filterOnlyFavs = !filterOnlyFavs;
            this.classList.toggle('active');
            filterData();
        };

        onAuthStateChanged(auth, user => {
            const authSection = document.getElementById('authSection');
            if(user) {
                const avatar = user.photoURL ? `<img src="${user.photoURL}" class="user-photo">` : `<i class="fas fa-user-circle default-avatar-icon"></i>`;
                authSection.innerHTML = `
                    <div class="user-info">
                        <span>${user.displayName || 'Dora Fã'}</span>
                        <div class="user-avatar-container">${avatar}</div>
                    </div>
                    <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
                `;
                document.getElementById('btnLogout').onclick = async (e) => {
                    e.preventDefault();
                    await signOut(auth);
                    window.location.href = "https://doranovel.com";
                };
            } else {
                authSection.innerHTML = `<a href="login.html" class="btn-sair">ENTRAR</a>`;
            }
        });

        async function init() {
            const snap = await getDocs(collection(db, "Produções"));
            allData = [];
            snap.forEach(doc => {
                const d = doc.data();
                allData.push({
                    id: doc.id,
                    titulo: d.Título || d.titulo || "Título Indisponível",
                    capa: d.Capa || d.capa || "",
                    categorias: d.Categoria || d.categoria || [],
                    video: d["Link do Episódio"] || d.video || "#"
                });
            });
            render(allData);
        }
        init();
    </script>
</body>
</html>
