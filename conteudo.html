<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('fundo2.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            width: 100%; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000;
        }
        .brand-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-img { height: 50px; }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.8rem; text-transform: uppercase; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #E1AD01; }
        .btn-sair { color: #E1AD01; text-decoration: none; font-weight: 700; border: 1px solid #E1AD01; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; }

        /* --- FILTROS --- */
        .search-container { padding: 20px 5%; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .search-box input, .category-filter {
            padding: 15px 25px; border-radius: 50px; border: 1px solid #E1AD01;
            background: rgba(0,0,0,0.7); color: #fff; outline: none; font-family: 'Montserrat';
        }
        .search-box { flex: 2; min-width: 280px; }
        .category-filter { flex: 1; min-width: 200px; cursor: pointer; }

        /* --- GRID E CARDS (ESTILO 163820.jpg) --- */
        .content-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px; padding: 20px 5%;
        }

        .card {
            border-radius: 25px; overflow: hidden; transition: 0.3s;
            cursor: pointer; display: flex; flex-direction: column; padding: 10px;
            height: 350px; position: relative;
        }
        .card:hover { transform: scale(1.03); }

        .card-img-container { 
            width: 100%; flex-grow: 1; border-radius: 18px; 
            overflow: hidden; position: relative; background: #000;
        }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }

        /* Ícone de Favorito corrigido */
        .btn-fav {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
            border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; 
            z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .btn-fav.active { color: #ff4757; }
        .btn-fav:hover { transform: scale(1.2); }

        .card-info { padding: 12px 5px; text-align: center; color: #000; }
        .card-category { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-bottom: 3px; }
        .card-title { font-weight: 700; font-size: 0.8rem; line-height: 1.2; }

        /* CORES DE CATEGORIA */
        .cat-encontros { background-color: #D48498; }
        .cat-melodramas { background-color: #A52A2A; color: #fff !important; }
        .cat-melodramas .card-info { color: #fff; }
        .cat-suspense { background-color: #F0F0F0; }
        .cat-epicos { background-color: #CD7F32; }
        .cat-medicina { background-color: #50C878; }

        /* --- MODAL DO PLAYER VERTICAL (FULLSCREEN FEEL) --- */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content { 
            width: 100%; 
            height: 100%; 
            max-width: 500px; /* Largura de um celular para manter proporção vertical */
            position: relative; 
            background: #000;
        }
        .video-wrapper { 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            position: relative;
        }
        /* Ajuste para esconder bordas do YouTube e forçar aspecto vertical */
        .video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh; /* Inverte proporção para cobrir a tela */
            height: 100vw;
            transform: translate(-50%, -50%) rotate(0deg);
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-modal {
            position: absolute; top: 20px; left: 20px; color: #fff; 
            font-size: 1.5rem; cursor: pointer; z-index: 2100;
            background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
            border: 1px solid #E1AD01;
        }

        @media (max-width: 768px) { .navbar { flex-direction: column; padding: 15px; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        </a>
        <div class="nav-right" id="authSection">
            <a href="login.html" class="btn-sair">ENTRAR</a>
        </div>
    </nav>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar dorama ou livro...">
        </div>
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">🌸 Encontros e Destinos</option>
            <option value="Suspense & Mistério">🔍 Suspense & Mistério</option>
            <option value="Melodramas Intensos">❤️‍🔥 Melodramas Intensos</option>
            <option value="Épicos Históricos">📜 Épicos Históricos</option>
            <option value="Medicina & Vida">🏥 Medicina & Vida</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid"></main>

    <div class="video-modal" id="videoModal">
        <span class="close-modal" id="closeModal"><i class="fas fa-chevron-left"></i> Voltar</span>
        <div class="modal-content">
            <div class="video-wrapper">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let allData = []; // Banco de dados local

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Melodramas Intensos": "cat-melodramas",
            "Suspense & Mistério": "cat-suspense",
            "Épicos Históricos": "cat-epicos",
            "Medicina & Vida": "cat-medicina"
        };

        function render(list) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";
            
            list.forEach(item => {
                const colorClass = colorMap[item.categoria] || '';
                const card = document.createElement('div');
                card.className = `card ${colorClass}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <button class="btn-fav" onclick="event.stopPropagation(); this.classList.toggle('active')">
                            <i class="fas fa-heart"></i>
                        </button>
                        <img src="${item.capa}" alt="${item.titulo}">
                    </div>
                    <div class="card-info">
                        <div class="card-category">${item.categoria}</div>
                        <div class="card-title">${item.titulo}</div>
                    </div>
                `;
                
                card.onclick = () => openVideo(item.video);
                grid.appendChild(card);
            });
        }

        function openVideo(url) {
            if(!url) return;
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoIframe');
            
            // Transformar link normal em Embed Vertical
            let videoId = "";
            if(url.includes("v=")) videoId = url.split("v=")[1].split("&")[0];
            else if(url.includes("shorts/")) videoId = url.split("shorts/")[1].split("?")[0];
            else videoId = url.split("/").pop();

            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Trava o scroll do site
        }

        document.getElementById('closeModal').onclick = () => {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
            document.body.style.overflow = 'auto';
        };

        // FILTROS CORRIGIDOS
        const filterData = () => {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryTerm = document.getElementById('categorySelect').value;

            const filtered = allData.filter(item => {
                const matchesSearch = item.titulo.toLowerCase().includes(searchTerm);
                const matchesCategory = (categoryTerm === 'all' || item.categoria === categoryTerm);
                return matchesSearch && matchesCategory;
            });
            render(filtered);
        };

        document.getElementById('searchInput').oninput = filterData;
        document.getElementById('categorySelect').onchange = filterData;

        async function load() {
            const snap = await getDocs(collection(db, "Produções"));
            allData = [];
            snap.forEach(doc => {
                const d = doc.data();
                allData.push({
                    titulo: d.Título || d.titulo,
                    capa: d.Capa || d.capa,
                    categoria: d.categoria || d.Categoria,
                    video: d["Link do Episódio"] || d.video
                });
            });
            render(allData);
        }

        load();

        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('authSection').innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${user.photoURL || 'https://via.placeholder.com/35'}" class="user-avatar">
                        <a href="#" id="btnLogout" class="btn-sair">SAIR</a>
                    </div>
                `;
                document.getElementById('btnLogout').onclick = () => signOut(auth);
            }
        });
    </script>
</body>
</html>
