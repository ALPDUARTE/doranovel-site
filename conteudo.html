<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ESTILO BASE E RESPONSIVIDADE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('fundo2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
        }

        /* --- NAVBAR ADAPTÁVEL --- */
        .navbar {
            width: 100%; height: auto; min-height: 80px; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 5%; background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #E1AD01;
            position: sticky; top: 0; z-index: 1000; flex-wrap: wrap;
        }
        .brand-gold { color: #E1AD01; font-weight: 700; font-size: 1.5rem; text-transform: uppercase; }

        /* --- FILTROS RESPONSIVOS --- */
        .search-container {
            padding: 20px 5%;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .search-box {
            flex: 2;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid #E1AD01;
            background: rgba(0,0,0,0.8);
            color: #fff;
            outline: none;
            font-size: 1rem;
        }

        .category-filter {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            border-radius: 50px;
            border: 1px solid #E1AD01;
            background: #000;
            color: #fff;
            cursor: pointer;
            font-family: 'Montserrat';
        }

        /* --- GRID DE CARDS INTELIGENTE --- */
        .content-grid {
            display: grid;
            /* Ajusta colunas automaticamente conforme o espaço disponível */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 30px 5%;
        }

        /* CARD ESTILO APP (Baseado nas cores e categorias informadas) */
        .card {
            border-radius: 20px;
            padding: 12px;
            position: relative;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card:hover { transform: translateY(-8px); }

        .card-img-container {
            width: 100%;
            aspect-ratio: 2/3; /* Proporção de poster de filme */
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #111;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info { text-align: center; }
        .card-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; line-height: 1.2; }
        .card-category { font-size: 0.7rem; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; }

        .fav-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .fav-icon.active { color: #ff4757; }

        /* CORES DAS CATEGORIAS */
        .cat-encontros { background-color: #D48498; }
        .cat-suspense { background-color: #F0F0F0; color: #000; }
        .cat-melodramas { background-color: #A52A2A; }
        .cat-epicos { background-color: #CD7F32; }
        .cat-cotidiano { background-color: #D2B48C; color: #000; }
        .cat-direito { background-color: #000080; }
        .cat-medicina { background-color: #50C878; }
        .cat-juventude { background-color: #E1AD01; color: #000; }

        /* --- MEDIA QUERIES PARA AJUSTES FINOS --- */
        @media (min-width: 1024px) {
            .content-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px; }
        }

        @media (max-width: 480px) {
            .content-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
            .card-title { font-size: 0.8rem; }
            .navbar { justify-content: center; gap: 10px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-gold">Dora<span style="color:#fff">novel</span></div>
        <a href="login.html" style="color: #E1AD01; text-decoration: none; font-weight: 700; font-size: 0.9rem; border: 1px solid #E1AD01; padding: 8px 15px; border-radius: 20px;">SAIR</a>
    </nav>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Pesquisar dorama ou livro...">
        </div>
        
        <select class="category-filter" id="categorySelect">
            <option value="all">Todas Categorias</option>
            <option value="Encontros e Destinos">🌸 Encontros e Destinos</option>
            <option value="Suspense & Mistério">🔍 Suspense & Mistério</option>
            <option value="Melodramas Intensos">❤️‍🔥 Melodramas Intensos</option>
            <option value="Épicos Históricos">📜 Épicos Históricos</option>
            <option value="Cotidiano">☕ Cotidiano</option>
            <option value="Direito & Justiça">⚖️ Direito & Justiça</option>
            <option value="Medicina & Vida">🏥 Medicina & Vida</option>
            <option value="Juventude & Sonhos">🎓 Juventude & Sonhos</option>
        </select>
    </div>

    <main class="content-grid" id="contentGrid">
        <!-- Carregado via Firebase -->
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const grid = document.getElementById('contentGrid');

        const colorMap = {
            "Encontros e Destinos": "cat-encontros",
            "Suspense & Mistério": "cat-suspense",
            "Melodramas Intensos": "cat-melodramas",
            "Épicos Históricos": "cat-epicos",
            "Cotidiano": "cat-cotidiano",
            "Direito & Justiça": "cat-direito",
            "Medicina & Vida": "cat-medicina",
            "Juventude & Sonhos": "cat-juventude"
        };

        async function loadContent() {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Carregando...</p>';
            try {
                const querySnapshot = await getDocs(collection(db, "Produções"));
                const data = [];
                querySnapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                
                const render = (list) => {
                    grid.innerHTML = '';
                    list.forEach(item => {
                        const colorClass = colorMap[item.categoria] || '';
                        const card = document.createElement('div');
                        card.className = `card ${colorClass}`;
                        card.innerHTML = `
                            <i class="fa-solid fa-heart fav-icon" onclick="this.classList.toggle('active')"></i>
                            <div class="card-img-container">
                                <img src="${item.capa}" alt="${item.nome}" loading="lazy">
                            </div>
                            <div class="card-info">
                                <div class="card-category">${item.categoria}</div>
                                <div class="card-title">${item.nome}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                };

                render(data);

                document.getElementById('searchInput').oninput = (e) => {
                    const filtered = data.filter(i => i.nome.toLowerCase().includes(e.target.value.toLowerCase()));
                    render(filtered);
                };

                document.getElementById('categorySelect').onchange = (e) => {
                    const filtered = e.target.value === 'all' ? data : data.filter(i => i.categoria === e.target.value);
                    render(filtered);
                };

            } catch (e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Erro ao conectar ao Firebase.</p>';
            }
        }

        loadContent();
    </script>
</body>
</html>
