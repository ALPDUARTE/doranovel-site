<!-- ADICIONE ESTE ESTILO AO SEU <style> -->
<style>
    /* ... seus estilos anteriores ... */

    .download-step-overlay {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        background: #1a1a1a;
        border: 2px solid #E1AD01;
        border-radius: 15px;
        padding: 20px;
        z-index: 9999;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
        from { bottom: -100px; opacity: 0; }
        to { bottom: 20px; opacity: 1; }
    }

    .step-item {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        text-align: left;
    }

    .step-number {
        background: #E1AD01;
        color: #000;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        flex-shrink: 0;
    }

    .btn-entendido {
        width: 100%;
        padding: 10px;
        background: #333;
        color: #E1AD01;
        border: 1px solid #E1AD01;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<!-- ADICIONE ESTE HTML ANTES DO FECHAMENTO DO </body> -->
<div id="stepOverlay" class="download-step-overlay">
    <h4 style="color:#E1AD01; margin-bottom: 15px; text-align: center;">Quase lá!</h4>
    
    <div class="step-item">
        <div class="step-number">1</div>
        <p style="font-size: 14px;">O download começou. Aguarde a barra de progresso no topo do celular.</p>
    </div>

    <div class="step-item">
        <div class="step-number">2</div>
        <p style="font-size: 14px;">Quando terminar, deslize a tela para baixo e clique em <b>"app-debug_2.apk"</b>.</p>
    </div>

    <div class="step-item">
        <div class="step-number">3</div>
        <p style="font-size: 14px;">Se o Android perguntar, autorize a instalação de "Fontes Desconhecidas".</p>
    </div>

    <button class="btn-entendido" onclick="document.getElementById('stepOverlay').style.display='none'">OK, ENTENDI</button>
</div>

<!-- AJUSTE NO SEU SCRIPT -->
<script>
    const downloadLink = document.getElementById('downloadLink');
    const stepOverlay = document.getElementById('stepOverlay');

    downloadLink.onclick = () => {
        // Mostra o passo a passo assim que o download inicia
        stepOverlay.style.display = 'block';
        
        // Opcional: Se quiser esconder após 15 segundos automaticamente
        setTimeout(() => {
            stepOverlay.style.display = 'none';
        }, 15000);
    };
</script>
