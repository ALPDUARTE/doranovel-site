<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Acesso Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILO BASE E FUNDO DA TELA TODA --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            
            /* AQUI A IMAGEM VAI PARA O FUNDO DO SITE INTEIRO */
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('fundo2.png'),
                        url('https://raw.githubusercontent.com/ALPDUARTE/doranovel-site/main/fundo2.png'),
                        url('https://cdn.jsdelivr.net/gh/ALPDUARTE/doranovel-site@main/fundo2.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Mantém o fundo parado ao rolar */
            background-repeat: no-repeat;
            background-color: #000;
        }

        .navbar {
            width: 100%; height: 100px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; background: rgba(0, 0, 0, 0.8); border-bottom: 2px solid #E1AD01;
            backdrop-filter: blur(10px); /* Leve desfoque na barra */
        }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .mini-logo { height: 60px; width: auto; }
        .brand-name { font-size: 28px; font-weight: 700; color: #fff; display: flex; align-items: center; line-height: 1; }
        .brand-gold { color: #E1AD01; }
        .back-link { color: #E1AD01; text-decoration: none; font-size: 14px; font-weight: 700; text-transform: uppercase; }

        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5%; }

        /* --- BLOCOS CENTRALIZADOS (EFEITO TRANSPARENTE) --- */
        .login-box, .download-box { 
            flex: 1; 
            max-width: 450px; 
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px; 
            border-radius: 25px; 
            border: 1px solid rgba(225, 173, 1, 0.5); /* Borda dourada semi-transparente */
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            
            /* Efeito de Vidro: deixa o fundo aparecer levemente através do card */
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
        }

        .login-box h2, .download-box h3 { font-size: 2.2rem; margin-bottom: 20px; color: #E1AD01; text-shadow: 2px 2px 10px #000; }
        
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: #E1AD01; text-transform: uppercase; font-weight: bold; }
        .input-group input { 
            width: 100%; padding: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(225, 173, 1, 0.3); 
            border-radius: 10px; color: #fff; font-family: 'Montserrat'; outline: none; transition: 0.3s;
        }
        .input-group input:focus { background: rgba(0, 0, 0, 0.5); border-color: #E1AD01; }

        .btn-access { 
            width: 100%; padding: 16px; background: #E1AD01; border: none; border-radius: 10px; 
            color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-bottom: 15px;
            transition: 0.3s; font-size: 14px;
        }
        .btn-access:hover { background: #fff; transform: scale(1.02); }
        
        .social-login { 
            width: 100%; padding: 12px; background: #fff; border: none; 
            border-radius: 10px; color: #000; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; gap: 12px; font-weight: 700; font-size: 13px; transition: 0.3s;
        }

        .btn-download { display: inline-block; padding: 16px 40px; background: #E1AD01; color: #000; border-radius: 50px; text-decoration: none; font-weight: 700; text-transform: uppercase; transition: 0.4s; margin-top: 15px; }
        .btn-download:hover { background: #fff; transform: translateY(-3px); }
        
        .btn-logout { margin-top: 30px; background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 10px; transition: 0.3s; }
        .btn-logout:hover { background: #ff4444; color: #fff; }

        #logged-out-view, #logged-in-view { display: none; }

        @media (max-width: 768px) { 
            .login-box, .download-box { width: 100%; min-height: 480px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="mini-logo">
            <span class="brand-name"><span class="brand-gold">Dora</span>novel</span>
        </div>
        <a href="index.html" class="back-link">Voltar</a>
    </nav>

    <main class="login-wrapper">
        <section class="login-box" id="logged-out-view">
            <h2>Acessar</h2>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div style="text-align: right; margin-bottom: 20px;"><a href="#" id="forgotBtn" style="color:#fff; font-size:11px; text-decoration:none;">Esqueceu a senha?</a></div>
            <button class="btn-access" id="loginSmartBtn">Entrar</button>
            <button class="social-login" id="googleBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" style="width:18px" alt="G"> 
                Entrar com Google
            </button>
        </section>

        <section class="download-box" id="logged-in-view">
            <h3>Bem-vindo!</h3>
            <p id="user-greeting" style="margin-bottom: 10px; color: #E1AD01; font-weight: 700; font-size: 1.3rem;"></p>
            <p style="margin-bottom: 25px; color: #fff; line-height: 1.6;">Acesso liberado. Baixe agora o app oficial da Doranovel para Android ou assista pelo site.</p>
            <a href="doranovel-v1.apk" class="btn-download">BAIXAR APP</a>
            <br>
            <button class="btn-logout" id="logoutBtn">Sair da Conta</button>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loggedOutView = document.getElementById('logged-out-view');
        const loggedInView = document.getElementById('logged-in-view');
        const userGreeting = document.getElementById('user-greeting');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'flex';
                userGreeting.innerText = user.displayName ? "Olá, " + user.displayName : "Olá!";
            } else {
                loggedOutView.style.display = 'flex';
                loggedInView.style.display = 'none';
            }
        });

        document.getElementById('googleBtn').onclick = () => signInWithPopup(auth, provider);

        document.getElementById('loginSmartBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("Preencha os campos.");
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code.includes('user-not-found') || error.code.includes('invalid-credential')) {
                    try { await createUserWithEmailAndPassword(auth, email, password); } 
                    catch (err) { alert("Erro no cadastro: " + err.message); }
                } else { alert("Erro: " + error.message); }
            }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);
        document.getElementById('forgotBtn').onclick = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (!email) return alert("Insira o e-mail.");
            await sendPasswordResetEmail(auth, email);
            alert("E-mail enviado!");
        };
    </script>
</body>
</html>
