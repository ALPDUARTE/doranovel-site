<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doranovel | Acesso Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILO BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar {
            width: 100%; height: 100px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; background: #000; border-bottom: 2px solid #E1AD01;
        }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        .mini-logo { height: 60px; width: auto; }
        .brand-name { font-size: 28px; font-weight: 700; color: #fff; display: flex; align-items: center; line-height: 1; }
        .brand-gold { color: #E1AD01; }
        .back-link { color: #E1AD01; text-decoration: none; font-size: 14px; font-weight: 700; text-transform: uppercase; }

        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5%; gap: 50px; }

        /* ESTILO UNIFICADO PARA AS CAIXAS (LOGIN E DOWNLOAD) */
        .login-box, .download-box { 
            flex: 1; 
            max-width: 450px; 
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid #E1AD01; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;

            /* Configuração da Imagem de Fundo */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                              url('https://cdn.jsdelivr.net/gh/ALPDUARTE/doranovel-site@main/fundo2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box h2, .download-box h3 { font-size: 2rem; margin-bottom: 20px; color: #E1AD01; text-shadow: 2px 2px 8px rgba(0,0,0,1); }
        
        /* Ajustes de Formulário */
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 12px; color: #eee; text-transform: uppercase; font-weight: bold; text-shadow: 1px 1px 3px #000; }
        .input-group input { 
            width: 100%; padding: 15px; background: rgba(20, 20, 20, 0.85); border: 1px solid #444; 
            border-radius: 8px; color: #fff; font-family: 'Montserrat'; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: #E1AD01; background: rgba(30, 30, 30, 0.95); }

        .forgot-password { text-align: right; margin-bottom: 20px; }
        .forgot-password a { color: #E1AD01; font-size: 12px; text-decoration: none; font-weight: bold; }

        .btn-access { 
            width: 100%; padding: 15px; background: #E1AD01; border: none; border-radius: 8px; 
            color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-bottom: 15px;
            transition: 0.3s;
        }
        .btn-access:hover { background: #fff; transform: translateY(-2px); }
        
        .social-login { 
            width: 100%; padding: 12px; background: #fff; border: none; 
            border-radius: 8px; color: #757575; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; gap: 12px; font-weight: 700; margin-bottom: 20px;
            font-size: 14px; transition: 0.3s;
        }
        .social-login:hover { background: #f1f1f1; }
        .google-icon { width: 20px; height: 20px; }

        /* Estilos da Tela Logada */
        .btn-download { display: inline-block; padding: 15px 40px; background: transparent; border: 2px solid #E1AD01; color: #E1AD01; border-radius: 50px; text-decoration: none; font-weight: 700; text-transform: uppercase; transition: 0.4s; margin-top: 10px; }
        .btn-download:hover { background: #E1AD01; color: #000; }
        .btn-logout { margin-top: 25px; background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
        .btn-logout:hover { background: #ff4444; color: #fff; }

        #logged-out-view, #logged-in-view { display: none; }

        @media (max-width: 768px) { 
            .navbar { height: auto; flex-direction: column; padding: 15px 5% 10px; }
            .login-wrapper { flex-direction: column; gap: 30px; } 
            .login-box, .download-box { width: 100%; min-height: 450px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="mini-logo">
            <span class="brand-name"><span class="brand-gold">Dora</span>novel</span>
        </div>
        <a href="index.html" class="back-link">Voltar</a>
    </nav>

    <main class="login-wrapper">
        <!-- VISÃO DESLOGADO -->
        <section class="login-box" id="logged-out-view">
            <h2>Acessar</h2>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="forgot-password"><a href="#" id="forgotBtn">Esqueceu a senha?</a></div>
            <button class="btn-access" id="loginSmartBtn">Entrar</button>
            
            <button class="social-login" id="googleBtn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" class="google-icon" alt="Google Logo"> 
                Entrar com Google
            </button>
        </section>

        <!-- VISÃO LOGADO -->
        <section class="download-box" id="logged-in-view">
            <h3>Bem-vindo!</h3>
            <p id="user-greeting" style="margin-bottom: 15px; color: #fff; font-weight: 700; font-size: 1.2rem;"></p>
            <p style="margin-bottom: 30px; color: #eee; line-height: 1.5; text-shadow: 1px 1px 2px #000;">Acesso liberado. Baixe agora o app oficial da Doranovel para sistema Android, ou assista pelo site todo nosso acervo.</p>
            <a href="doranovel-v1.apk" class="btn-download">BAIXAR APP - ANDROID</a>
            <br>
            <button class="btn-logout" id="logoutBtn">Sair da Conta</button>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKnX6uIhWGmV51lDq80zor6TP9xlyMhcY",
            authDomain: "doranovel.firebaseapp.com",
            projectId: "doranovel",
            storageBucket: "doranovel.firebasestorage.app",
            appId: "1:105334550592:web:eaf414923e311ae62eafa5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loggedOutView = document.getElementById('logged-out-view');
        const loggedInView = document.getElementById('logged-in-view');
        const userGreeting = document.getElementById('user-greeting');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'flex';
                userGreeting.innerText = user.displayName ? "Olá, " + user.displayName : "Olá!";
            } else {
                loggedOutView.style.display = 'flex';
                loggedInView.style.display = 'none';
            }
        });

        document.getElementById('googleBtn').onclick = () => {
            signInWithPopup(auth, provider).catch((error) => alert("Erro: " + error.message));
        };

        document.getElementById('loginSmartBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("Preencha os campos.");

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (err) { alert("Erro no cadastro: " + err.message); }
                } else { alert("Erro: " + error.message); }
            }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);
        
        document.getElementById('forgotBtn').onclick = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (!email) return alert("Insira o e-mail.");
            await sendPasswordResetEmail(auth, email);
            alert("E-mail de recuperação enviado!");
        };
    </script>
</body>
</html>
